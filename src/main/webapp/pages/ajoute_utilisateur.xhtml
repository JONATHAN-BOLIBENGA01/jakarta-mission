<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Créer un compte - Jakarta Mission</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS for Fonts -->
    <link rel="stylesheet" href="#{request.contextPath}/resources/css/style.css"/>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f5132', 
                        secondary: '#0dcaf0', 
                        accent: '#d4af37', 
                        sand: '#fdfbf7',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
</h:head>
<h:body class="bg-sand text-gray-800 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-md shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center">
                    <a href="#{request.contextPath}/index.xhtml" class="flex items-center gap-2 text-2xl font-serif font-bold text-primary">
                        <i class="fas fa-leaf text-emerald-600"></i>
                        <span>Jakarta Mission</span>
                    </a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8">
                        <a href="#{request.contextPath}/index.xhtml" class="text-gray-700 hover:text-primary px-3 py-2 rounded-md text-sm font-medium transition-colors">Accueil</a>
                        <a href="#{request.contextPath}/index.xhtml#destinations" class="text-gray-700 hover:text-primary px-3 py-2 rounded-md text-sm font-medium transition-colors">Destinations</a>
                        <a href="#{request.contextPath}/index.xhtml#culture" class="text-gray-700 hover:text-primary px-3 py-2 rounded-md text-sm font-medium transition-colors">Culture</a>
                        <a href="#{request.contextPath}/index.xhtml#contact" class="text-gray-700 hover:text-primary px-3 py-2 rounded-md text-sm font-medium transition-colors">Contact</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center pt-24 pb-10 px-4 relative">
        <!-- Background Image -->
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&amp;fit=crop&amp;w=1920&amp;q=80" 
                 alt="Indonesian Landscape" 
                 class="w-full h-full object-cover"/>
            <div class="absolute inset-0 bg-white/40 backdrop-blur-sm"></div>
        </div>

        <!-- Form Section -->
        <div class="relative z-10 max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden p-8 md:p-10">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-serif font-bold text-primary mb-2">Rejoignez l'aventure</h1>
                <p class="text-gray-600">Créez votre compte pour explorer l'Indonésie.</p>
            </div>

            <h:form id="userForm" class="space-y-5">
                <h:messages globalOnly="true" layout="table" 
                            styleClass="w-full p-4 mb-4 text-sm rounded-lg"
                            infoClass="bg-green-100 text-green-700 border border-green-400"
                            errorClass="bg-red-100 text-red-700 border border-red-400"
                            warnClass="bg-yellow-100 text-yellow-700 border border-yellow-400"/>
                
                <div>
                    <h:outputLabel for="username" value="Nom d'utilisateur" styleClass="block text-sm font-medium text-gray-700 mb-1"/>
                    <h:inputText id="username" value="#{utilisateurBean.username}"
                                 required="true" requiredMessage="Le nom d'utilisateur est obligatoire" 
                                 styleClass="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
                        <f:validateLength minimum="3" maximum="50" />
                    </h:inputText>
                    <h:message for="username" styleClass="text-red-500 text-xs mt-1 block"/>
                </div>
                
                <div>
                    <h:outputLabel for="email" value="Email" styleClass="block text-sm font-medium text-gray-700 mb-1"/>
                    <h:inputText id="email" value="#{utilisateurBean.email}" required="true" requiredMessage="L'email est obligatoire"
                                 styleClass="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"/>
                    <h:message for="email" styleClass="text-red-500 text-xs mt-1 block" />
                </div>

                <div>
                    <h:outputLabel for="password" value="Mot de passe" styleClass="block text-sm font-medium text-gray-700 mb-1"/>
                    <h:inputSecret id="password" value="#{utilisateurBean.password}" required="true" requiredMessage="Le mot de passe est obligatoire"
                                   styleClass="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all">
                        <f:validateLength minimum="8"/>
                    </h:inputSecret>
                    <h:message for="password" styleClass="text-red-500 text-xs mt-1 block" />
                </div>

                <div>
                    <h:outputLabel for="confirmPassword" value="Confirmer le mot de passe" styleClass="block text-sm font-medium text-gray-700 mb-1"/>
                    <h:inputSecret id="confirmPassword" value="#{utilisateurBean.confirmPassword}" required="true" requiredMessage="La confirmation est obligatoire"
                                   styleClass="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"/>
                    <h:message for="confirmPassword" styleClass="text-red-500 text-xs mt-1 block" />
                </div>
                
                <div>
                    <h:outputLabel for="description" value="Description (optionnel)" styleClass="block text-sm font-medium text-gray-700 mb-1"/>
                    <h:inputTextarea id="description" value="#{utilisateurBean.description}" rows="3"
                                     styleClass="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all resize-none"/>
                </div>

                <div class="pt-4">
                    <h:commandButton value="Créer mon compte" action="#{utilisateurBean.ajouterUtilisateur}"
                                     styleClass="w-full py-3 px-6 rounded-xl bg-emerald-600 text-white font-semibold shadow-lg hover:bg-emerald-700 hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 cursor-pointer" />
                </div>
                
                <div class="text-center mt-6">
                    <a href="#{request.contextPath}/index.xhtml" class="text-sm text-emerald-600 hover:text-emerald-700 font-medium">Retour à l'accueil</a>
                </div>
            </h:form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8 relative z-10">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 text-sm">2025 Jakarta Mission. Tous droits réservés.</p>
        </div>
    </footer>

</h:body>
</html>
